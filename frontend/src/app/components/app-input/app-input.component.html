<div class="app-input__field">
  <label class="app-input__label" [attr.for]="controlId">{{ label() }}</label>

  @if (isSelect) {
    <ion-select
      class="app-input__control"
      [attr.id]="controlId"
      [attr.name]="name()"
      interface="popover"
      [value]="value"
      [placeholder]="placeholder()"
      [disabled]="isControlDisabled"
      (ionChange)="handleValueChange($event.detail.value)"
      (ionBlur)="handleBlur()">
      @for (option of options(); track option.value) {
        <ion-select-option [value]="option.value">
          {{ option.label }}
        </ion-select-option>
      }
    </ion-select>
  } @else {
    <ion-input
      class="app-input__control"
      [attr.id]="controlId"
      [attr.name]="name()"
      [type]="type()"
      [value]="value"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [disabled]="isControlDisabled"
      [required]="required()"
      [clearInput]="showClearButton"
      (ionInput)="handleValueChange($event.detail.value ?? '')"
      (ionBlur)="handleBlur()">
      @if (isPassword) {
        <ion-input-password-toggle slot="end" />
      }
    </ion-input>
  }
</div>
