<ion-input
  class="app-input__control"
  labelPlacement="start"
  [name]="name()"
  [type]="type()"
  [value]="value()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [disabled]="disabled()"
  [required]="required()"
  [clearInput]="!isPassword()"
  (ionInput)="handleInput($event.detail.value)"
  (ionBlur)="handleBlur()">
  <span slot="label" class="app-input__label">{{ label() }}</span>
  @if (isPassword()) {
    <ion-input-password-toggle slot="end" color="medium" />
  }
</ion-input>
