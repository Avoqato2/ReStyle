<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      @if (variant() === 'main') {
        <ion-menu-button autoHide="false"></ion-menu-button>
      } @else {
        <ion-back-button [defaultHref]="backHref()" text=""></ion-back-button>
      }
    </ion-buttons>

    <div class="header-logo">
      <img src="/assets/branding/restyle-logo-small.svg" alt="ReStyle Logo" class="logo"/>
    </div>

    @if (variant() === 'main'){
      <ion-buttons slot="end">
        <ion-button routerLink="/home">
          <ion-icon
            class="profile-icon"
            src="/assets/icon/PLATZHALTER_Profile.svg"
            aria-label="Profil"
          ></ion-icon>
        </ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>
