<ion-button
  [size]="size()"
  [expand]="expand()"
  [disabled]="disabled()"
  [type]="type()"
  fill="solid"
  shape="round"
>
  @if (iconStart()) {
    <ion-icon
      [name]="iconStart()"
      slot="start"
    />
  }

  <ng-content />

  @if (iconEnd()) {
    <ion-icon
      [name]="iconEnd()"
      slot="end"
    />
  }
</ion-button>
