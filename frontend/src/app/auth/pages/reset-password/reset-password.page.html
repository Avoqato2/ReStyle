<ion-content [fullscreen]="true">
  <main class="new-password-screen">
    <section class="new-password-content" aria-labelledby="new-password-title">
      <header class="new-password-heading">
        <app-header></app-header>
        <h1 id="new-password-title">
          Neues Passwort
        </h1>
        <p>
          Erstelle ein neues sicheres Passwort
        </p>
      </header>

      <form class="new-password-form">
        <div class="new-password-field">
          <label class="new-password-field">
            <span class="new-password__label">Neues Passwort eingeben</span>
            <input
              #newPasswordInput
              type="password"
              name="newPassword"
              placeholder="Passwort eingeben"
              required
            />
          </label>
          <label class="new-password-confirm-field">
            <span class="new-password-confirm__label">Neues Passwort eingeben</span>
            <input
              #newPasswordConfirmInput
              type="password"
              name="newPasswordConfirm"
              placeholder="Passwort wiederholen"
              required
            />
          </label>
        </div>
        <button class="auth-link" routerLink="/password-changed">Bestätigen</button>
      </form>
    </section>
  </main>
</ion-content>
