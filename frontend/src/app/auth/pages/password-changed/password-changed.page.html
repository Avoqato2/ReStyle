<ion-content [fullscreen]="true">
  <main class="password-changed-screen">
    <section class="password-changed-content" aria-labelledby="password-changed-title">
      <header class="password-changed-heading">
        <app-header></app-header>
      </header>
      <h1 id="password-changed-title">
          Passwort geändert!
        </h1>
        <p>
          Dein Passwort wurde erfolgreich geändert.
        </p>
      <button class="auth-link" routerLink="/login">Zur Startseite</button>
    </section>
  </main>
</ion-content>
