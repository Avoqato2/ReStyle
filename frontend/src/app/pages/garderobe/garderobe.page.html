<app-header></app-header>

<ion-content class="ion-padding">
  @if (isLoading()) {
    <p>Garderobe wird geladen...</p>
  } @else {
    <ion-grid>
      <ion-row>
        @for (garment of garments(); track garment.id) {
          <app-garment-card
          [garmentId]="garment.id"
          [garmentImageUrl]="garment.imageUrl"
          [garmentName]="garment.name ?? categoryLabels[garment.category]"
          [garmentLayer]="layerLabels[garment.layer]"
          [garmentCategory]="categoryLabels[garment.category]"
          (deleteClick)="deleteGarment(garment.id)">
          </app-garment-card>
        } @empty {
          <ion-title>Meine Garderobe ist nocht leer</ion-title>
          <ion-text>Füge erste Kleidungsstücke hinzu und gestalte deine persönliche Garderobe.</ion-text>
        }
      </ion-row>
    </ion-grid>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/add-garment">
      <ion-icon name="add"></ion-icon>
      TEIL HINZUFÜGEN
    </ion-fab-button>
  </ion-fab>
</ion-content>
