<ion-header [translucent]="true">
  <app-header></app-header>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-title>Hallo *Name*</ion-title>
  <ion-text>Entdecke neue Looks in deiner Gaderobe</ion-text>
  
  <div class="card-button-grid">
    <app-card-buttons
      cardIcon="assets/icon/styling.svg"
      title="LOOK STYLEN"
      cardDescription="Selbst kombinieren">
    </app-card-buttons>

    <app-card-buttons
      cardIcon="assets/icon/sparkle.svg"
      title="IDEEN FINDEN"
      cardDescription="Neues entdecken">
    </app-card-buttons>

    <app-card-buttons
      cardIcon="assets/icon/my-looks.svg"
      title="MEINE LOOKS"
      cardDescription="Gespeicherte Outfits">
    </app-card-buttons>

    <app-card-buttons
      cardIcon="assets/icon/add.svg"
      title="TEIL HINZUFÜGEN"
      cardDescription="Gaderobe erweitern">
    </app-card-buttons>
  </div>
  <app-image-card></app-image-card>
  <ion-title>Meine Garderobe</ion-title>
  <app-carousel></app-carousel>
  <ion-grid>
    <ion-row>
      @for (photo of photoService.photos(); track photo.filepath; let position = $index) {
        <ion-col size="6">
          <img [src]="photo.webviewPath" [attr.alt]="'Photo ' + (position + 1)" loading="lazy" />
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="addPhotoToGallery()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
