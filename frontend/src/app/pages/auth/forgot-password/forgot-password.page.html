<ion-content [fullscreen]="true">
  <main class="forgot-password-screen">
    <section class="forgot-password-content" aria-labelledby="forgot-password-title">
      <header class="forgot-password-heading">
        <app-header></app-header>
        <h1 id="forgot-password-title">
          Passwort vergessen?
        </h1>
        <p>
          Gib die mit deinem Konto verknüpfte E-Mail-Adresse ein und wir senden dir einen Link zum Zurücksetzen deines Passworts.
        </p>
      </header>
      <form class="forgot-password-form" (ngSubmit)="passwordReset()">
        <div class="forgot-password-fields">
          <label class="forgot-password-field">
            <span class="forgot-password-field__label">E-mail:</span>
            <input
              #emailInput
              [(ngModel)]="email"
              type="text"
              name="email"
              autocomplete="username"
              placeholder="z.B. anna@sup.com"
              required
            />
          </label>
        </div>
        <ng-hcaptcha
          (verify)="onCaptchaVerified($event)"
          (expired)="onCaptchaExpired()"
          (error)="onCaptchaError()">
        </ng-hcaptcha>

        <button
          type="submit"
          class="auth-link"
          [disabled]="!captchaToken">
          Link anfordern
        </button>
      </form>
      @if (toastVisible) {
          <p class="auth-error" role="alert">
            {{ toastMessage }}
          </p>
        }
    </section>
  </main>
</ion-content>
