<app-header variant="sub" backHref="/login"/>
<ion-content>
  <main class="new-password-screen">
    <section class="new-password-content" aria-labelledby="new-password-title">
      <header class="new-password-heading">
        <h1 id="new-password-title">
          Neues Passwort
        </h1>
        <p>
          Erstelle ein neues sicheres Passwort
        </p>
      </header>

      <form class="new-password-form" (ngSubmit)="submit()">
        <div class="new-password-field">
          <app-input
            label="Neues Passwort:"
            name="newPassword"
            type="password"
            autocomplete="new-password"
            [(ngModel)]="newPassword"
            placeholder="Passwort eingeben"
            [required]="true" />

          <app-input
            label="Wiederholen:"
            name="newPasswordConfirm"
            type="password"
            autocomplete="new-password"
            [(ngModel)]="newPasswordConfirm"
            placeholder="Passwort wiederholen"
            [required]="true" />
        </div>
        <app-button type="submit">Bestätigen</app-button>
      </form>
        @if (toastVisible) {
          <p class="auth-error" role="alert">
            {{ toastMessage }}
          </p>
        }
    </section>
  </main>
</ion-content>
