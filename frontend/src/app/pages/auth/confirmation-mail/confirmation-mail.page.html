<ion-content [fullscreen]="true">
  <main class="confirmation-mail-screen">
    <section class="confirmation-mail-content" aria-labelledby="confirmation-mail-title">
      <header class="confirmation-mail-heading">
        <app-header></app-header>
      </header>
      <h1>
        Prüfe dein E-Mail-Postfach
      </h1>

    </section>
  </main>
</ion-content>
