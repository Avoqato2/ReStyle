name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "frontend/**"
permissions:
  contents: read
  pull-requests: read

# Bricht alte PR-Läufe automatisch ab, wenn neuer Code gepusht wird
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Prüft, ob Dateien im Frontend-Ordner geändert wurden
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'

      # Führt das Setup und den Build NUR aus, wenn das Frontend geändert wurde
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      
      # Run tests using Vitest before build process
      - name: Unit Tests (Vitest)
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npx ng test --no-watch
      
      - name: Build Frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build
        
      # Optional to add: vitest coverage to check if tests are covered
        
      # Überspringt den Rest elegant, wenn es ein reiner Backend-PR ist
      - name: Skip Info
        if: steps.changes.outputs.frontend == 'false'
        run: echo "Keine Frontend-Änderungen. Build übersprungen! ✅"
