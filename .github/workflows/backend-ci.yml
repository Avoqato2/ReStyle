name: Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/supabase/**"
  # Deploy nochmal anstoßen ohne Dummy-Commit
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Bricht alte PR-Läufe automatisch ab, wenn neuer Code gepusht wird
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prüft zentral, ob Backend betroffen ist
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v7

      # Prüft, ob Dateien im Backend-Ordner geändert wurden
      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend/supabase/**'

  validate:
    name: Validate Migrations
    needs: detect-changes
    # Führt das Setup und den Test NUR aus, wenn das Backend geändert wurde
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Test Database Migrations
        run: |
          supabase db start
          supabase db reset

  deploy:
    name: Deploy to Supabase
    needs: [ detect-changes, validate ]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy DB
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push
