name: Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/supabase/**"
permissions:
  contents: read
  pull-requests: read

# Bricht alte PR-Läufe automatisch ab
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Prüft, ob Dateien im Backend-Ordner geändert wurden
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            backend:
              - 'backend/supabase/**'

      # Startet Supabase NUR, wenn sich das Backend geändert hat
      - uses: supabase/setup-cli@v3
        if: steps.changes.outputs.backend == 'true'
        with:
          version: latest

      - name: Test Database Migrations
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        run: |
          supabase db start
          supabase db reset

      - name: Skip Info
        if: steps.changes.outputs.backend == 'false'
        run: echo "Keine Backend-Änderungen. Datenbank-Test übersprungen! ✅"

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Deploy DB
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push
